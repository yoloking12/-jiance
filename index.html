<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结构承载力监测面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100%;
            background: rgba(184, 225, 245, 0.25);
            font-family: "Microsoft YaHei", sans-serif;
            position: relative;
            overflow: hidden;
        }
        /* 外框 + 四角科技角标 */
        .container {
            width: 96%;
            height: 96%;
            position: absolute;
            top: 2%;
            left: 2%;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 10px;
        }
        .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border-color: #ffffff;
            border-style: solid;
            border-width: 2px 0 0 2px;
        }
        .c1 { top: 0; left: 0; border-radius: 6px 0 0 0; }
        .c2 { top: 0; right: 0; border-width: 2px 2px 0 0; border-radius: 0 6px 0 0; }
        .c3 { bottom: 0; left: 0; border-width: 0 0 2px 2px; border-radius: 0 0 0 6px; }
        .c4 { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-radius: 0 0 6px 0; }
        /* 扫描线动画 */
        .scan-line {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #40c9ff, transparent);
            position: absolute;
            animation: scan 3.5s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { top: calc(100% - 3px); opacity: 0; }
        }
        /* 标题样式 */
        .title {
            text-align: center;
            padding: 10px 6px;
            font-size: 18px;
            color: #165e8c;
            font-weight: bold;
        }
        /* 2×2网格布局 */
        .grid-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 6px 10px;
        }
        .item-card {
            background-color: rgba(255, 255, 255, 0.38);
            border-radius: 8px;
            text-align: center;
            padding: 10px 4px;
        }
        .item-name {
            font-size: 12px;
            color: #1c6b9c;
            margin-bottom: 4px;
        }
        .item-value {
            font-size: 24px;
            font-weight: bold;
            color: #0f4c72;
        }
        .item-unit {
            font-size: 11px;
            color: #33779e;
        }
        /* 漂浮光点 */
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); opacity: 0.25; }
            50% { transform: translateY(-12px); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scan-line"></div>
        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>

        <div class="title">办公楼加装电梯改造｜结构承载力实时监测</div>

        <div class="grid-box">
            <div class="item-card">
                <div class="item-name">Z‑01柱承载力利用率</div>
                <div class="item-value" id="val1">45.8</div>
                <div class="item-unit">%</div>
            </div>
            <div class="item-card">
                <div class="item-name">主梁L‑01应力</div>
                <div class="item-value" id="val2">15.7</div>
                <div class="item-unit">MPa</div>
            </div>
            <div class="item-card">
                <div class="item-name">楼板最大挠度</div>
                <div class="item-value" id="val3">2.23</div>
                <div class="item-unit">mm</div>
            </div>
            <div class="item-card">
                <div class="item-name">结构安全储备</div>
                <div class="item-value" id="val4">67.1</div>
                <div class="item-unit">%</div>
            </div>
        </div>
    </div>

    <script>
        //生成浮动光点
        for(let i = 0; i < 10; i++) {
            const dot = document.createElement("div");
            dot.className = "dot";
            dot.style.left = Math.random() * 100 + "%";
            dot.style.top = Math.random() * 100 + "%";
            dot.style.animationDelay = Math.random() * 4 + "s";
            document.body.appendChild(dot);
        }
        //传感器数值小幅动态跳动
        setInterval(() => {
            document.getElementById("val1").innerText = (44 + Math.random() * 4).toFixed(1);
            document.getElementById("val2").innerText = (14.5 + Math.random() * 2.2).toFixed(1);
            document.getElementById("val3").innerText = (2.1 + Math.random() * 0.3).toFixed(2);
            document.getElementById("val4").innerText = (66 + Math.random() * 3).toFixed(1);
        }, 1200);
    </script>
</body>
</html>
